{% extends 'base.html' %}
{% block content %}
<style>
  body {
    background-image: url("{{ url_for('static', filename='images/img6.jpeg') }}") !important;
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
  }
</style>
<div class="auth-container">
  <div class="card auth-card">
    <div class="text-center mb-4">
      <h1 style="font-size: var(--text-2xl); margin-bottom: var(--spacing-2);">Welcome Back</h1>
      <p class="text-muted">Log in to your AI Job Coach account</p>
    </div>

    <form class="login-form" method="POST" action="/login">

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-4);">Sign In</button>
    </form>

    <div class="text-center mt-4" style="font-size: var(--text-sm);">
      <p>Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary"
          style="font-weight: 600;">Create one</a></p>
    </div>
  </div>
</div>

{% endblock %}
